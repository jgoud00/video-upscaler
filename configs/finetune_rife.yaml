# RIFE (Frame Interpolation) Configuration
task: "interpolation"
experiment_name: "rife_v1"
seed: 42
log_dir: "logs"
log_every_n_steps: 10

device:
  gpu_id: 0
  use_amp: true
  amp_dtype: "float16"

data:
  train_dir: "data/train_sequences"
  val_dir: "data/val_sequences"
  batch_size: 2
  num_workers: 4
  patch_size: 256

degradation:
  blur_prob: 0.0
  noise_prob: 0.0
  jpeg_prob: 0.0
  downsample_prob: 0.0 # Interpolation trains on clean frames

freeze:
  freeze_strategy: "blocks"
  num_frozen_blocks: 1 # Freeze early encoder

lora:
  enabled: true
  rank: 8
  alpha: 16.0
  target_modules: ["Conv2d"]

loss:
  pixel_weight: 1.0
  perceptual_weight: 0.0
  gan_weight: 0.0

optimizer:
  name: "adamw"
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.99]
  max_grad_norm: 1.0
  gradient_accumulation_steps: 4

scheduler:
  name: "cosine"
  total_steps: 100000

checkpoint:
  save_dir: "checkpoints"
  save_every_n_steps: 5000
  keep_last_n: 3
  pretrained_path: "checkpoints/pretrained/IFNet_HDv3.pth"
