[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-enhancer"
version = "0.1.0"
description = "Fine-tune pretrained deep learning models for video enhancement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Jaswant"}]

dependencies = [
    # Core DL
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",

    # Real-ESRGAN / BasicSR ecosystem
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
    "facexlib>=0.3.0",
    "gfpgan>=1.3.8",

    # Image / Video I/O
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # Metrics
    "lpips>=0.1.4",
    "scikit-image>=0.21.0",
    "pyiqa>=0.1.10",

    # Experiment tracking
    "tensorboard>=2.14.0",

    # Config
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",

    # Utilities
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
